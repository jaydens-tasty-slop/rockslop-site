# Battery runs: stock vs Rockbox, same files, level-matched, played to empty.
# Source: the repo's docs/battery-benchmark.md (YP3) and docs/ts17-battery.md
# (TS17), as of 2026-11-19. Feeds the port pages' charts and the hardware
# comparison table. Stock must be a group's first run (percentages are "of
# stock"). mode: wired | bt. pending: true = not measured yet.
scale_hours: 30
groups:
  - { id: yp3-wired, port: yp3, mode: wired, title: "Headphone jack", runs: [
      { fw: stock, label: "Stock firmware", hours: 21.29 },
      { fw: rockbox, label: "Rockbox", hours: 20.07 } ] }
  - { id: yp3-bt, port: yp3, mode: bt, title: "Bluetooth (A2DP to a PC, 1 m)", runs: [
      { fw: stock, label: "Stock firmware", hours: 20.82 },
      { fw: rockbox, label: "Rockbox", hours: 19.55 } ] }
  - { id: ts17-wired, port: ts17, mode: wired, title: "Headphone jack", runs: [
      { fw: stock, label: "Stock firmware", hours: 17.99 },
      { fw: rockbox, label: "Rockbox", hours: 27.28 } ] }
  - { id: ts17-bt, port: ts17, mode: bt, title: "Bluetooth (A2DP to a PC, 1 m)", runs: [
      { fw: stock, label: "Stock firmware", pending: true },
      { fw: rockbox, label: "Rockbox", pending: true } ] }
