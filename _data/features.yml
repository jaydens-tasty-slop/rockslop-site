- group: "Radio & recording"
  items: ["FM radio", "FM recording", "Microphone recording"]
- group: "System"
  items: ["Real power-off and wake", "Touchscreen", "Real-time clock and alarm", "Charge limit"]
- group: "Install"
  items: ["Flash with rockslop", "Return to stock with rockslop"]
