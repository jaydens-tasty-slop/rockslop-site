# Plugins and apps done one at a time (not part of a family layer).
# origin: original = written for this port; port = someone else's game or app.
# `links` are the upstream projects and credits; leave out what has none.
- name: RockGPT
  origin: original
  kind: App
  what: A small language model that chats on the player.
  credit: Written for this port; the engine follows llama2.c.
  links: [{ text: llama2.c, url: "https://github.com/karpathy/llama2.c" }]
- name: RockTrack
  origin: original
  kind: App
  what: A tracker and module player/editor.
  credit: Written for this port. Demo songs from The Mod Archive.
  links: [{ text: The Mod Archive, url: "https://modarchive.org" }]
- name: EBT Tracker
  origin: port
  kind: App
  what: A chip-tune tracker.
  credit: ESPboy EBT.
  links: [{ text: ESPboy EBT Tracker, url: "https://github.com/ESPboy-edu/ESPboy_EBT_Tracker" }]
- name: Anarch
  origin: port
  kind: Game
  what: A raycasting shooter.
  credit: drummyfish, CC0.
  links: [{ text: Anarch, url: "https://codeberg.org/drummyfish/Anarch" }]
