# Hardware comparison rows, in order. Values live in each player's file
# (players/<id>.md, `hardware:`). The download-mode and playback-hours
# rows are generated from `download:` and `battery:`.
- group: "Processor"
  rows: ["SoC", "CPU"]
- group: "Memory"
  rows: ["RAM", "Code storage", "Execute in place (XIP)", "Music storage"]
- group: "Display & input"
  rows: ["Display", "Touch", "Buttons"]
- group: "Wireless & audio"
  rows: ["Bluetooth", "FM radio", "Microphone", "Speaker"]
- group: "Physical"
  rows: ["USB", "Battery", "Case"]
