# Status vocabulary. `cls` is a Just the Docs label colour (empty = plain text).
working:  { label: Working,  cls: label-green }
partial:  { label: Partial,  cls: label-yellow }
broken:   { label: Broken,   cls: label-red }
planned:  { label: Planned,  cls: label-blue }
unknown:  { label: Untested, cls: label-blue }
na:       { label: N/A,      cls: "" }
released: { label: Released, cls: label-green }
dev:      { label: In development, cls: label-yellow }
rejected: { label: Rejected, cls: label-red }
parked:   { label: Parked,   cls: label-blue }
triage:   { label: Triage,   cls: label-blue }
