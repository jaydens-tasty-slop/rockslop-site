title: rockslop
tagline: Rockbox for cheap MP3 players
description: >-
  rockslop installs Rockbox on cheap MP3 players, and puts them back to stock.

# Custom domain: served from the root path.
url: "https://rockslop.jayd.ml"
baseurl: ""

# The one call to action on the whole site.
releases_url: "https://github.com/jaydens-tasty-slop/rockslop/releases"
repo_url: "https://github.com/jaydens-tasty-slop/rockslop"

theme: just-the-docs
# Our look: _sass/color_schemes/rockslop.scss and _sass/custom/custom.scss.
color_scheme: rockslop

sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

permalink: /announcements/:year/:month/:day/:title/
timezone: America/Denver
lang: en-US

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
nav_sort: case_insensitive
back_to_top: true
back_to_top_text: Back to top
favicon_ico: "/assets/images/favicon.svg"

# "Donate to Rockbox" (here and in the sidebar below) is Rockbox's own PayPal
# donation button from rockbox.org. The money goes to the Rockbox project,
# not to rockslop.
# Header links: the donation link, then the one call to action.
aux_links:
  "Donate to Rockbox":
    - "https://www.paypal.com/donate/?hosted_button_id=BTE95P4QL87E4"
  "Releases":
    - "https://github.com/jaydens-tasty-slop/rockslop/releases"
aux_links_new_tab: false

# Sidebar link under the page list.
nav_external_links:
  - title: rockslop on GitHub
    url: "https://github.com/jaydens-tasty-slop/rockslop"
    opens_in_new_tab: true
  - title: rockbox (our fork) on GitHub
    url: "https://github.com/jaydens-tasty-slop/rockbox"
    opens_in_new_tab: true
  - title: auto-rockbox on GitHub
    url: "https://github.com/jaydens-tasty-slop/auto-rockbox"
    opens_in_new_tab: true
  - title: Donate to Rockbox
    url: "https://www.paypal.com/donate/?hosted_button_id=BTE95P4QL87E4"
    opens_in_new_tab: true

footer_content: >-
  rockslop is unofficial and experimental. Rockbox is GPL-licensed free
  software; this site is not affiliated with the Rockbox project.
  <a href="https://github.com/jaydens-tasty-slop/rockslop-site">Site source</a>.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  todo:
    title: ''
    color: yellow

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      parent: Announcements
      nav_exclude: true

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor
